<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - RVS Theater</title>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

        <style>
            /* Page-specific tweaks so we don't have to change global CSS */
            .admin-actions{
                display:grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap:14px;
                margin-top: 10px;
            }
            .admin-action-btn{
                width:100%;
                background: rgba(255,255,255,0.04);
                border: 1px solid rgba(255,255,255,0.10);
                color: #fff;
                border-radius: 16px;
                padding: 16px 12px;
                font-weight: 800;
                cursor: pointer;
                transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
                display:flex;
                align-items:center;
                justify-content:center;
                gap: 12px;
                backdrop-filter: blur(10px);
            }

        .admin-action-btn i{
            font-size: 1.15rem;
        }
        .admin-action-btn span{
            font-size: 0.98rem;
            white-space: nowrap;
        }
        .admin-action-btn:hover{
            transform: translateY(-2px);
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.45);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }
        .admin-action-btn:active{
            transform: translateY(-1px) scale(0.99);
        }
        
        .admin-action-notice{
            box-shadow: inset 0 0 0 1px rgba(50,205,50,0.25);
        }
        .admin-action-notice:hover{
            background: rgba(50,205,50,0.12);
            border-color: rgba(50,205,50,0.45);
        }
        
        .admin-action-movie{
            box-shadow: inset 0 0 0 1px rgba(229,9,20,0.25);
        }
        .admin-action-upcoming{
            box-shadow: inset 0 0 0 1px rgba(255,215,0,0.25);
        }
        .admin-action-upcoming:hover{
            background: rgba(255,215,0,0.12);
            border-color: rgba(255,215,0,0.45);
            color: #fff;
        }
        .admin-action-all{
            box-shadow: inset 0 0 0 1px rgba(0,191,255,0.22);
        }
        .admin-action-all:hover{
            background: rgba(0,191,255,0.12);
            border-color: rgba(0,191,255,0.45);
            color: #fff;
        }
        .admin-action-banner{
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
        }

        .admin-action-btn:hover{
            background: rgba(229, 9, 20, 0.16);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            transform: translateY(-2px);
        }
        @media (max-width: 520px){
            .admin-actions{grid-template-columns: 1fr;}
        }

        .admin-page {
            width: 90%;
            max-width: 900px;
            margin: 120px auto 60px;
            padding: 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.45);
        }
        .admin-header {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 16px;
        }
        .admin-header i {
            font-size: 2.2rem;
            color: var(--primary);
        }
        .admin-page h1 {
            font-size: 2rem;
            line-height: 1.2;
        }
        .admin-page p {
            color: #aaa;
            font-size: 1rem;
            line-height: 1.6;
            margin: 10px 0 0;
        }
        .admin-back {
            margin-top: 18px;
            display: inline-flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.35);
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .admin-back i { color: var(--primary); }
    </style>

</head>
<body>
    <header>
        <div class="brand">RVS <span>Theater</span></div>
    </header>

    <main class="admin-page">
        <div class="admin-header">
            <i class="fas fa-user-shield" aria-hidden="true"></i>
        </div>

        <h1 style="margin: 6px 0 4px;">Admin Upload</h1>
        <p style="margin-bottom: 18px;">Choose what you want to upload.</p>

        <div class="admin-actions" aria-label="Admin actions">
            <button type="button" class="admin-action-btn admin-action-notice" onclick="window.location.href='notice-upload.html'">
                <i class="fas fa-bullhorn" aria-hidden="true"></i>
                <span>Upload Notice</span>
            </button>

            <button type="button" class="admin-action-btn admin-action-movie" onclick="alert('upload movie')">
                <i class="fas fa-film" aria-hidden="true"></i>
                <span>Upload Movie</span>
            </button>

            <button type="button" class="admin-action-btn admin-action-all" onclick="window.location.href='all-movies.html'">
                <i class="fas fa-ticket-alt" aria-hidden="true"></i>
                <span>All Movies</span>
            </button>

            <button type="button" class="admin-action-btn admin-action-banner" onclick="window.location.href='banner-upload.html'">
                <i class="fas fa-image" aria-hidden="true"></i>
                <span>Upload Banner</span>
            </button>
        </div>



    </main>


</body>
</html>
